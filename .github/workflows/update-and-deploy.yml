name: Actualizar Radar y Desplegar en GitHub Pages

on:
  schedule:
    # 4 ventanas diarias fuera de hora en punto para compensar posibles retrasos de GitHub Actions
    # UTC: 05:17, 09:23, 14:41, 19:19 (España invierno: 06:17, 10:23, 15:41, 20:19)
    - cron: "17 5 * * *"
    - cron: "23 9 * * *"
    - cron: "41 14 * * *"
    - cron: "19 19 * * *"
  workflow_dispatch: {}
  push:
    branches: ["main"]
    paths-ignore:
      - "README.md"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "vector84-pages"
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    # Solo ejecuta el scraper en schedule o ejecución manual (o si aún no existe feed.json)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Recopilar noticias, papers y resumir con Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: "gemini-flash-lite-latest"
        run: python3 scripts/update_feed.py

      - name: Guardar cambios en data/feed.json y feed.xml
        run: |
          git config user.name "vector84-bot"
          git config user.email "vector84-bot@users.noreply.github.com"
          git add data/feed.json feed.xml
          if git diff --cached --quiet; then
            echo "Sin cambios nuevos en el feed."
          else
            git commit -m "chore(feed): actualización automática $(date -u +'%Y-%m-%d')"
            git push
          fi

  build-pages:
    needs: [update-data]
    if: always() && (needs.update-data.result == 'success' || needs.update-data.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout última versión de main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Empaquetar sitio estático
        uses: actions/upload-pages-artifact@v4
        with:
          path: "."

  deploy-pages:
    needs: [build-pages]
    if: always() && needs.build-pages.result == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
